<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CashCam | Pi Network Shorts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div id="splash">
            <div class="splash-content">
                <div class="logo-gold">💰 CashCam</div>
                <div class="sub" data-i18n="app_name">Pi Network Premium Shorts</div>
                <div class="spinner"></div>
            </div>
        </div>
        <div id="main-content" style="display: none;">
            <div id="shorts-container"></div>
            <nav id="bottom-nav">
                <button class="nav-btn active" data-page="home"><span class="material-icons">home</span><span data-i18n="home">الرئيسية</span></button>
                <button class="nav-btn" data-page="friends"><span class="material-icons">people</span><span data-i18n="friends">الأصدقاء</span></button>
                <button class="nav-btn" data-page="upload"><span class="material-icons add-icon">add_box</span><span data-i18n="upload">نشر</span></button>
                <button class="nav-btn" data-page="inbox"><span class="material-icons">inbox</span><span data-i18n="inbox">الوارد</span></button>
                <button class="nav-btn" data-page="profile"><span class="material-icons">account_circle</span><span data-i18n="profile">ملفي</span></button>
            </nav>
        </div>
    </div>

    <div id="upload-modal" class="modal glass-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 data-i18n="upload_video">✨ رفع فيديو جديد ✨</h3>
            <div class="upload-area" id="upload-area">
                <span class="material-icons">cloud_upload</span>
                <p data-i18n="drag_drop">اسحب الفيديو أو اضغط للاختيار</p>
                <input type="file" id="video-upload" accept="video/*" hidden>
            </div>
            <input type="text" id="video-caption" data-i18n-placeholder="caption_placeholder" placeholder="اكتب وصفاً جذاباً...">
            <button id="publish-video" class="gold-btn" data-i18n="publish_btn">نشر الفيديو +20 نقطة</button>
        </div>
    </div>

    <div id="comments-modal" class="modal glass-modal">
        <div class="modal-content">
            <span class="close-comments">&times;</span>
            <h3 data-i18n="comments">💬 التعليقات</h3>
            <div id="comments-list"></div>
            <div class="add-comment">
                <input type="text" id="new-comment" data-i18n-placeholder="add_comment" placeholder="أضف تعليقاً...">
                <button id="send-comment" data-i18n="send">إرسال</button>
            </div>
        </div>
    </div>

    <div id="language-selector" style="position: fixed; top: 12px; right: 12px; z-index: 10000; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border-radius: 40px; padding: 5px 10px;">
        <select id="langSelect" style="background: #ffd966; border: none; border-radius: 30px; padding: 6px 12px; font-weight: bold;">
            <option value="ar">🇸🇦 العربية</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
        </select>
    </div>

    <script src="languages.js"></script>
    <script src="script.js"></script>
</body>
</html>
