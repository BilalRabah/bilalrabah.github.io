<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CashCam</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>CashCam</h1>

    <p>Powered by Pi Network</p>

    <!-- Login Button -->
    <button id="login">
      Login with Pi
    </button>

    <!-- Payment Button -->
    <button id="paybtn">
      Pay with Pi
    </button>

    <!-- User Info -->
    <div id="userinfo"></div>

  </div>

  <script>

    Pi.init({
      version: "2.0",
      sandbox: true
    });

    const scopes = ['username', 'payments'];

    function onIncompletePaymentFound(payment) {
      console.log('Incomplete payment found:', payment);
    }

    // LOGIN

    async function login() {

      try {

        const auth = await Pi.authenticate(
          scopes,
          onIncompletePaymentFound
        );

        console.log(auth);

        document.getElementById("userinfo").innerHTML = `

          <h2>Welcome ${auth.user.username}</h2>

          <p>User ID:</p>

          <small>${auth.user.uid}</small>

        `;

      } catch (error) {

        console.error(error);

        alert("Login Failed");

      }

    }

    // PAYMENT

    async function pay() {

      const paymentData = {
        amount: 1,
        memo: "CashCam Payment",
        metadata: {
          type: "payment"
        }
      };

      const callbacks = {

        onReadyForServerApproval: async function(paymentId) {

          const res = await fetch('/api/approve-payment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              paymentId
            })
          });

          console.log(await res.json());

        },

        onReadyForServerCompletion: async function(paymentId, txid) {

          const res = await fetch('/api/complete-payment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              paymentId,
              txid
            })
          });

          console.log(await res.json());

        },

        onCancel: function(paymentId) {

          console.log("Cancelled", paymentId);

        },

        onError: function(error, payment) {

          console.error(error);

        }

      };

      await Pi.createPayment(
        paymentData,
        callbacks
      );

    }

    // BUTTONS

    document
      .getElementById("login")
      .addEventListener("click", login);

    document
      .getElementById("paybtn")
      .addEventListener("click", pay);

  </script>

</body>

</html>
